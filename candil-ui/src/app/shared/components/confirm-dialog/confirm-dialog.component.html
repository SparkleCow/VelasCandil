<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  {{ data.message }}
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="dialogRef.close(false)">Cancelar</button>

  <button mat-flat-button color="warn" (click)="dialogRef.close(true)">
    Eliminar
  </button>
</mat-dialog-actions>
