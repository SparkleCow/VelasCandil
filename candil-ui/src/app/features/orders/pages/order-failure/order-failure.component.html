
<div class="result-page">
  <div class="result-card">

    <div class="result-icon failure">
      <mat-icon>cancel</mat-icon>
    </div>

    <h1>Pago rechazado</h1>
    <p class="subtitle">
      Hubo un problema al procesar tu pago.<br>
      Puedes intentarlo nuevamente desde tu carrito.
    </p>

    <div class="result-actions">
      <button mat-flat-button color="warn" (click)="goToCart()">
        <mat-icon>shopping_cart</mat-icon>
        Volver al carrito
      </button>
      <button mat-stroked-button (click)="goToHome()">
        <mat-icon>storefront</mat-icon>
        Ver catálogo
      </button>
    </div>

  </div>
</div>
