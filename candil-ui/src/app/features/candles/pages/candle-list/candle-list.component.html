<div class="catalog-page">
  <app-catalog-header
    [shown]="visibleCandles().length"
    [total]="totalElements()"
    [sort]="sort()"
    [density]="density()"
    (sortChange)="onSortChange($event)"
    (densityChange)="onDensityChange($event)"
/>

  <div class="catalog-layout">
    <div class="filters-slot">
      <app-catalog-filters
        [filtersForm]="form"
        [open]="drawerOpen()"
        [activeCount]="activeFilterCount()"
        (closed)="closeDrawer()"
      />
    </div>

    <section class="catalog-content">
      @if (loading()) {
        <app-catalog-skeleton [count]="pageSize" />
      } @else {
        @if (visibleCandles().length === 0) {
          <app-catalog-empty-state
            [hasFilters]="activeFilterCount() > 0"
            (clear)="clearFilters()"
          />
        } @else {
          <div class="grid" [class.grid--cozy]="density() === 'cozy'">
            @for (candle of visibleCandles(); track candle.id; let i = $index) {
              <app-product-card
                [candle]="candle"
                [imageUrl]="getImageUrl(candle.principalImage)"
                [index]="i % pageSize"
                [wishlisted]="isWishlisted(candle.id)"
                [adding]="addingId() === candle.id"
                (addToCart)="addToCart(candle)"
                (toggleWishlist)="toggleWishlist($event)"
              />
            }
          </div>
        }

        @if (totalElements() > pageSize) {
          <mat-paginator
            class="paginator"
            [length]="totalElements()"
            [pageIndex]="currentPage"
            [pageSize]="pageSize"
            [pageSizeOptions]="[6, 12, 24]"
            (page)="onPage($event)"
            showFirstLastButtons
            aria-label="Paginación del catálogo"
          />
        }
      }
    </section>
  </div>

  <div class="mobile-bar">
    <p class="mobile-bar__count">
      {{ visibleCandles().length }} vela{{ visibleCandles().length === 1 ? '' : 's' }}
    </p>
    <button class="mobile-bar__filter" type="button" (click)="openDrawer()">
      <mat-icon>tune</mat-icon>
      Filtrar
      @if (activeFilterCount() > 0) {
        <span class="mobile-bar__chip">{{ activeFilterCount() }}</span>
      }
    </button>
  </div>
</div>
